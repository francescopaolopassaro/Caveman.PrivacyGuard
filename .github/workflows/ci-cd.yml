name: CI/CD

# Build and test on every push and pull request.
# Pushing a tag such as v1.5.0 publishes Caveman.PrivacyGuard and Caveman.PrivacyGuard.Mcp to GitHub Packages
# and creates a GitHub release. Uses the built-in GITHUB_TOKEN (no secret needed).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test Caveman.PrivacyGuard.Tests/Caveman.PrivacyGuard.Tests.csproj -c Release

  publish-library:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Pack
        run: dotnet pack Caveman.PrivacyGuard/Caveman.PrivacyGuard.csproj -c Release -o out
      - name: Check the NuGet readme (text and tables only)
        run: |
          unzip -p out/Caveman.PrivacyGuard.*.nupkg README.nuget.md > readme.check
          if grep -nE '!\[|<img|<a |https?://|www\.' readme.check; then echo "README.nuget.md must contain only text and tables"; exit 1; fi
      - name: Push to GitHub Packages
        run: dotnet nuget push out/*.nupkg --api-key "${{ secrets.GITHUB_TOKEN }}" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --skip-duplicate
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*.nupkg
          generate_release_notes: true

  publish-mcp:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish-library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Add GitHub Packages as a package source (the core is restored from there)
        run: dotnet nuget add source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --name github --username "${{ github.repository_owner }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text
      - name: Pack
        run: dotnet pack Caveman.PrivacyGuard.Mcp/Caveman.PrivacyGuard.Mcp.csproj -c Release -o out
      - name: Push to GitHub Packages
        run: dotnet nuget push out/*.nupkg --api-key "${{ secrets.GITHUB_TOKEN }}" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --skip-duplicate
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*.nupkg
